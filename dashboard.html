<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard_</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <header>
    <a href="index.html">
      <img src="imagenes/logo.png" class="logo" alt="Logo ReFocus">
    </a>
 
    <button id="btn-logout">Cerrar sesión</button>
  </header>
 
  <main>
    <h1 id="saludo">Bienvenido</h1>
 
    <iframe
      src="https://thingsboard.cloud/dashboard/28028f60-be7a-11f1-a6e5-11e8fa25cdfc?publicId=755de5d0-c31a-11f1-b930-ad60e0953111"
      width="100%"
      height="600"
      style="border:none;"
    ></iframe>
  </main>
 
  <!-- SDK de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
 
  <script>
    const saludo = document.getElementById("saludo");
    const btnLogout = document.getElementById("btn-logout");
 
    auth.onAuthStateChanged((usuario) => {
      if (usuario) {
        saludo.textContent = "Bienvenido, " + usuario.displayName;
      } else {
        window.location.href = "login.html";
      }
    });
 
    btnLogout.addEventListener("click", async () => {
      await auth.signOut();
      window.location.href = "login.html";
    });
  </script>
 
</body>
</html>
