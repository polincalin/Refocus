<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard_</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a href="index.html">
      <img src="imagenes/logo.png" class="logo" alt="Logo ReFocus">
    </a>

    <button id="btn-logout">Cerrar sesión</button>
  </header>

  <main>
    <h1 id="saludo">Bienvenido</h1>

    <section id="panel-control">
      <h2>Control del wearable</h2>
      <p>Estado: <strong id="estado">Conectando...</strong></p>

      <button id="btn-calibrar" disabled>Calibrar</button>
      <button id="btn-iniciar" disabled>Iniciar sesión de estudio</button>
      <button id="btn-finalizar" disabled>Finalizar sesión</button>

      <p id="ayuda">
        Para calibrar, deja el sensor quieto y plano sobre una mesa.
        Al iniciar la sesión, quédate en reposo unos 30 segundos mientras se mide tu línea base.
      </p>
    </section>

    <iframe
      src="https://thingsboard.cloud/dashboard/28028f60-be7a-11f1-a6e5-11e8fa25cdfc?publicId=755de5d0-c31a-11f1-b930-ad60e0953111"
      width="100%"
      height="800"
      style="border:none;"
      title="Monitoreo en tiempo real"
    ></iframe>
  </main>

  <!-- SDK de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-conf.json"></script>

  <!-- Cliente MQTT para el navegador -->
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>

  <script>
    const saludo = document.getElementById("saludo");
    const btnLogout = document.getElementById("btn-logout");

    const db = firebase.firestore();

    let usuarioActual = null;
    let sesionActivaRef = null;
    let inicioSesionMs = null;
    let inicioDesdeWeb = false;

    auth.onAuthStateChanged(async (usuario) => {
      if (usuario) {
        usuarioActual = usuario;
        saludo.textContent = "Bienvenido, " + (usuario.displayName || usuario.email);
        await buscarSesionActiva();
      } else {
        window.location.href = "login.html";
      }
    });

    btnLogout.addEventListener("click", async () => {
      await auth.signOut();
      window.location.href = "login.html";
    });

    // ---------- Sesiones del usuario en Firestore ----------

    async function buscarSesionActiva() {
      if (!usuarioActual) return;

      const snapshot = await db
        .collection("usuarios")
        .doc(usuarioActual.uid)
        .collection("sesiones")
        .where("estado", "==", "activa")
        .limit(1)
        .get();

      if (!snapshot.empty) {
        const doc = snapshot.docs[0];
        sesionActivaRef = doc.ref;
        inicioSesionMs = doc.data().startTs;
      }
    }

    async function crearSesionUsuario() {
      if (!usuarioActual) return;

      await buscarSesionActiva();

      // Evita crear dos sesiones activas
      if (sesionActivaRef) return;

      inicioSesionMs = Date.now();

      sesionActivaRef = db
        .collection("usuarios")
        .doc(usuarioActual.uid)
        .collection("sesiones")
        .doc();

      await sesionActivaRef.set({
        uid: usuarioActual.uid,
        startTs: inicioSesionMs,
        endTs: null,
        duracionSegundos: 0,
        estado: "activa",
        origen: "web",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      console.log("Sesión creada en Firestore");
    }

    async function finalizarSesionUsuario() {
      if (!usuarioActual) return;

      // Por si la sesión fue iniciada desde Android
      if (!sesionActivaRef) {
        await buscarSesionActiva();
      }

      if (!sesionActivaRef) return;

      const endTs = Date.now();

      if (!inicioSesionMs) {
        const doc = await sesionActivaRef.get();
        inicioSesionMs = doc.data().startTs;
      }

      const duracionSegundos = Math.round(
        (endTs - inicioSesionMs) / 1000
      );

      await sesionActivaRef.update({
        endTs: endTs,
        duracionSegundos: duracionSegundos,
        estado: "finalizada",
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      sesionActivaRef = null;
      inicioSesionMs = null;

      console.log("Sesión finalizada en Firestore");
    }

    // ---------- Control del wearable por MQTT ----------

    const MQTT_URL = "wss://ab111316.ala.us-east-1.emqxsl.com:8084/mqtt";
    const MQTT_USER = "web";
    const MQTT_PASS = "web";

    const TOPIC_COMANDOS = "comandos";
    const TOPIC_ESTADO = "estado";

    const textoEstado = document.getElementById("estado");
    const btnCalibrar = document.getElementById("btn-calibrar");
    const btnIniciar = document.getElementById("btn-iniciar");
    const btnFinalizar = document.getElementById("btn-finalizar");

    let conectado = false;
    let estadoActual = "";

    function actualizarBotones() {
      const desconectado =
        !conectado || estadoActual === "Wearable desconectado";

      const ocupado =
        estadoActual.startsWith("Calibrando") ||
        estadoActual.startsWith("Preparando");

      const enSesion =
        estadoActual === "Sesión en curso";

      btnCalibrar.disabled = desconectado || ocupado || enSesion;
      btnIniciar.disabled = desconectado || ocupado || enSesion;
      btnFinalizar.disabled = desconectado || !enSesion;
    }

    const cliente = mqtt.connect(MQTT_URL, {
      username: MQTT_USER,
      password: MQTT_PASS,
      reconnectPeriod: 3000
    });

    cliente.on("connect", () => {
      conectado = true;
      cliente.subscribe(TOPIC_ESTADO);

      if (!estadoActual) {
        textoEstado.textContent =
          "Conectado, esperando al wearable...";
      }

      actualizarBotones();
    });

    cliente.on("close", () => {
      conectado = false;
      textoEstado.textContent =
        "Sin conexión con el servidor. Reintentando...";
      actualizarBotones();
    });

    cliente.on("error", (err) => {
      console.error("Error MQTT:", err.message);
    });

    cliente.on("message", async (topic, mensaje) => {
      try {
        const datos = JSON.parse(mensaje.toString());

        estadoActual = datos.estado || "";
        textoEstado.textContent = estadoActual;

        actualizarBotones();

        // La Raspberry confirma que realmente empezó
        if (estadoActual === "Sesión en curso") {

          if (inicioDesdeWeb) {
            await crearSesionUsuario();
            inicioDesdeWeb = false;
          } else {
            // Puede haberse iniciado desde Android
            await buscarSesionActiva();
          }
        }

        // La Raspberry confirma que terminó
        if (estadoActual === "Sesión finalizada") {
          await finalizarSesionUsuario();
          inicioDesdeWeb = false;
        }

        if (estadoActual === "Primero calibra el sensor") {
          inicioDesdeWeb = false;
        }

      } catch (e) {
        console.error(
          "Mensaje de estado no válido:",
          mensaje.toString()
        );
      }
    });

    function enviarComando(comando) {
      if (!conectado) return;

      cliente.publish(
        TOPIC_COMANDOS,
        JSON.stringify({ comando: comando })
      );
    }

    btnCalibrar.addEventListener("click", () => {
      enviarComando("calibrar");
    });

    btnIniciar.addEventListener("click", () => {
      inicioDesdeWeb = true;
      enviarComando("iniciar");
    });

    btnFinalizar.addEventListener("click", () => {
      enviarComando("finalizar");
    });

  </script>

</body>
</html>
