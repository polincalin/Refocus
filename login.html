<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | ReFocus</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a href="index.html">
      <img src="imagenes/logo.png" class="logo" alt="Logo ReFocus">
    </a>

    <a href="index.html" class="volver-inicio">Volver al inicio</a>
  </header>

  <main class="fondo-login">
    <div class="capa-login">

      <div class="caja-login">
        <h1>Iniciar sesión</h1>

        <form id="form-login">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Tu correo electrónico"
            autocomplete="email"
            required
          >

          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          >

          <button type="submit">Iniciar sesión</button>
        </form>

        <p>
          ¿No tienes una cuenta?
          <a href="registro.html">Regístrate</a>
        </p>
      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-conf.json"></script>
 
  <script>
    const formLogin = document.getElementById("form-login");
 
    formLogin.addEventListener("submit", async (evento) => {
      evento.preventDefault();
 
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
 
      await auth.signInWithEmailAndPassword(email, password);
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
