<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | ReFocus</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a href="index.html">
      <img src="imagenes/logo.png" class="logo" alt="Logo ReFocus">
    </a>

    <a href="index.html" class="volver-inicio">Volver al inicio</a>
  </header>

  <!-- Foto de fondo -->
  <main class="fondo-login">

    <!-- Capa lila sobre la foto -->
    <div class="capa-login">

      <!-- Cuadro blanco del formulario -->
      <div class="caja-login">
        <h1>Iniciar sesión</h1>

        <form action="login.php" method="post">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Tu correo electrónico"
            autocomplete="email"
            required
          >

          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          >

          <button type="submit">Iniciar sesión</button>
        </form>

        <p>
          ¿No tienes una cuenta?
          <a href="registro.html">Regístrate</a>
        </p>
      </div>

    </div>
  </main>
</body>
</html>
