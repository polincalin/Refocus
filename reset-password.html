<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | ReFocus</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <a href="index.html">
      <img src="imagenes/logo.png" class="logo" alt="Logo ReFocus">
    </a>

    <a href="login.html" class="volver-inicio">Volver al inicio de sesión</a>
  </header>

  <main class="fondo-login">
    <div class="capa-login">

      <div class="caja-login">
        <h1>Nueva contraseña</h1>

        <p id="mensaje">
          Verificando enlace...
        </p>

        <form id="form-reset" style="display: none;">

          <label for="password">Nueva contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Nueva contraseña"
            autocomplete="new-password"
            required
          >

          <label for="confirmar-password">Confirmar contraseña</label>
          <input
            type="password"
            id="confirmar-password"
            placeholder="Confirma tu contraseña"
            autocomplete="new-password"
            required
          >

          <p class="texto-password">
            Mínimo 8 caracteres, una mayúscula, una minúscula y un número.
          </p>

          <button type="submit">Cambiar contraseña</button>

        </form>

        <div id="exito" style="display: none;">
          <p>Tu contraseña fue actualizada correctamente.</p>

          <a href="login.html" class="boton boton-principal">
            Iniciar sesión
          </a>
        </div>

      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-conf.json"></script>

  <script>
    const parametros = new URLSearchParams(window.location.search);

    const mode = parametros.get("mode");
    const oobCode = parametros.get("oobCode");

    const mensaje = document.getElementById("mensaje");
    const formReset = document.getElementById("form-reset");
    const exito = document.getElementById("exito");

    let correoUsuario = "";

    async function verificarEnlace() {

      if (mode !== "resetPassword" || !oobCode) {
        mensaje.textContent =
          "Este enlace para restablecer la contraseña no es válido.";
        return;
      }

      try {

        correoUsuario =
          await auth.verifyPasswordResetCode(oobCode);

        mensaje.textContent =
          "Ingresa una nueva contraseña para " + correoUsuario;

        formReset.style.display = "block";

      } catch (error) {

        mensaje.textContent =
          "Este enlace ha expirado o ya no es válido.";

      }
    }


    formReset.addEventListener("submit", async (evento) => {

      evento.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmar =
        document.getElementById("confirmar-password").value;


      if (password !== confirmar) {
        alert("Las contraseñas no coinciden.");
        return;
      }


      const passwordSegura =
        password.length >= 8 &&
        /[A-Z]/.test(password) &&
        /[a-z]/.test(password) &&
        /[0-9]/.test(password);


      if (!passwordSegura) {
        alert(
          "La contraseña debe tener mínimo 8 caracteres, una mayúscula, una minúscula y un número."
        );
        return;
      }


      try {

        await auth.confirmPasswordReset(
          oobCode,
          password
        );

        mensaje.style.display = "none";
        formReset.style.display = "none";
        exito.style.display = "block";

      } catch (error) {

        alert(
          "No fue posible cambiar la contraseña. Solicita un nuevo enlace."
        );

      }

    });


    verificarEnlace();

  </script>

</body>
</html>
