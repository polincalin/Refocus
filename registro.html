<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RegistroReFocus</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <a href="index.html">
      <img src="imagenes/logo.png" class="logo" alt="Logo ReFocus">
    </a>

    <a href="index.html" class="volver-inicio">Volver al inicio</a>
  </header>

  <main class="fondo-login">
    <div class="capa-login">

      <div class="caja-login">
        <h1>Crear cuenta</h1>

        <form id="form-registro">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre"
            autocomplete="name"
            required
          >

          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Tu correo electrónico"
            autocomplete="email"
            required
          >

          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Crea una contraseña"
            autocomplete="new-password"
            required
          >

          <button type="submit">Crear cuenta</button>
        </form>

        <p>
          ¿Ya tienes una cuenta?
          <a href="login.html">Inicia sesión</a>
        </p>
      </div>

    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-conf.json"></script>
 
  <script>
    const formRegistro = document.getElementById("form-registro");
 
    formRegistro.addEventListener("submit", async (evento) => {
      evento.preventDefault();
 
      const nombre = document.getElementById("nombre").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (
  password.length < 8 ||
  !/[A-Z]/.test(password) ||
  !/[a-z]/.test(password) ||
  !/[0-9]/.test(password)
) {
  alert("La contraseña debe tener mínimo 8 caracteres, una mayúscula, una minúscula y un número.");
  return;
}
 
      const credencial = await auth.createUserWithEmailAndPassword(email, password);
      await credencial.user.updateProfile({ displayName: nombre });
      window.location.href = "dashboard.html";
    });
  </script>

</body>
</html>
